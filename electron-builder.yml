appId: com.assemblerai.claude-session-visualizer
productName: Claude Session Visualizer
copyright: Copyright © 2026 Assembler AI LLC

directories:
  buildResources: build
  output: dist

# electron-vite emits the three targets into out/. Nothing else is application code.
files:
  - out/**
  - package.json
  - '!**/*.map'

mac:
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch: [arm64, x64]
  # Gatekeeper refuses an unhardened app, and notarisation will not accept one.
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # Apple verifies the signature at notarisation; a local assessment only fails
  # on a machine whose Gatekeeper has not seen the ticket yet.
  gatekeeperAssess: false
  notarize: true

dmg:
  artifactName: ${name}-${version}-${arch}.${ext}

win:
  target:
    - target: nsis
      arch: [x64]
  # Unsigned: SmartScreen shows "Windows protected your PC" and
  # More info -> Run anyway gets past it. See README, "Releasing".

nsis:
  oneClick: false
  perMachine: false # a per-user install needs no elevation
  allowToChangeInstallationDirectory: true
  artifactName: ${name}-${version}-${arch}-setup.${ext}

# Releases are made by .github/workflows/release.yml, which uploads dist/ itself.
publish: null
