<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Session Manager</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- 'unsafe-inline' for styles is required by Tailwind's injected styles in dev; script-src stays locked to self. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' ws:"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./src/main.tsx"></script>
  </body>
</html>
