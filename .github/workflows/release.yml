name: Release

# Every push to main ships a patch release. For a minor or major release, run
# this workflow by hand from the Actions tab and pick the bump.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      bump:
        description: Which part of the version to bump
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: write # push the version commit and tag, and make the release

# One release at a time, in order. A push that lands while a release is running
# waits, and then releases on top of it.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Check, bump, tag, and make one draft release for both builds to upload into.
  # Left to the builds, each would make its own draft for the tag.
  version:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.bump.outputs.version }}
    steps:
      # main as it is now, not the commit that triggered this run: an earlier
      # queued release may have pushed a version commit since.
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Check
        run: npm run check

      # The push uses GITHUB_TOKEN, which never starts another workflow run, so
      # the version commit does not release itself.
      - name: Bump the version
        id: bump
        env:
          BUMP: ${{ inputs.bump || 'patch' }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          TAG="$(npm version "$BUMP" -m 'Release v%s')"
          git push --atomic origin HEAD:main "refs/tags/$TAG"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Make the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.bump.outputs.version }}
        run: gh release create "$TAG" --draft --verify-tag --title "$TAG" --generate-notes

  build:
    name: build (${{ matrix.os }})
    needs: version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    env:
      TAG: v${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # The certificate goes into a keychain made here rather than through
      # CSC_LINK: electron-builder's own temporary keychain fails to unlock on
      # the hosted macOS runner. With CSC_LINK unset, electron-builder finds the
      # Developer ID identity on the keychain search list.
      - name: Import the signing certificate
        if: runner.os == 'macOS'
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          echo "$MAC_CSC_LINK" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/certificate.p12" -k "$KEYCHAIN" -P "$MAC_CSC_KEY_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/certificate.p12"
          security find-identity -v -p codesigning "$KEYCHAIN"

      # electron-builder wants APPLE_API_KEY as a path to the .p8 file, so the
      # secret is decoded outside the workspace, where it cannot be packaged.
      - name: Stage the notarisation key
        if: runner.os == 'macOS'
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
        run: |
          echo "$APPLE_API_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/AuthKey.p8"
          # notarytool only says "invalidPEMDocument", and only after the whole build.
          if ! grep -q -- '-----BEGIN PRIVATE KEY-----' "$RUNNER_TEMP/AuthKey.p8"; then
            echo "::error::APPLE_API_KEY_BASE64 does not decode to a .p8 private key. Set it with: base64 -w0 AuthKey_<id>.p8 | gh secret set APPLE_API_KEY_BASE64"
            exit 1
          fi

      # Signed and notarised on macOS; unsigned on Windows (see README, "Releasing").
      - name: Package
        run: npm run package -- --publish never
        env:
          APPLE_API_KEY: ${{ runner.os == 'macOS' && format('{0}/AuthKey.p8', runner.temp) || '' }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          # Without this, electron-builder hunts the Windows certificate store
          # and fails the job rather than shipping unsigned.
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ runner.os == 'macOS' }}

      - name: Upload to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$RUNNER_OS" = macOS ]; then files=(dist/*.dmg); else files=(dist/*-setup.exe); fi
          gh release upload "$TAG" "${files[@]}" --clobber

  # Only once both platforms have uploaded: a release is never public half-built.
  publish:
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ needs.version.outputs.version }}
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
