name: Release
run-name: Release ${{ github.ref_name }}

# Builds and publishes the release for a version tag. Started by the Version
# workflow after it tags; to rebuild a version, run this by hand from the
# Actions tab with "Use workflow from" set to the tag.
on:
  workflow_dispatch:
  # A tag pushed by a person (GITHUB_TOKEN tag pushes start nothing).
  push:
    tags: ['v*']

permissions:
  contents: write # make and publish the release

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  # One draft, made before either build starts. Left to the builds, each would
  # make its own draft for the tag.
  draft:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.draft.outputs.version }}
    steps:
      - name: Make the draft release
        id: draft
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "A release for $TAG already exists; the builds will upload into it."
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --verify-tag --title "$TAG" --generate-notes
          fi

  build:
    name: build (${{ matrix.os }})
    needs: draft
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    env:
      TAG: v${{ needs.draft.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # The certificate goes into a keychain made here rather than through
      # CSC_LINK: electron-builder's own temporary keychain fails to unlock on
      # the hosted macOS runner. With CSC_LINK unset, electron-builder finds the
      # Developer ID identity on the keychain search list.
      - name: Import the signing certificate
        if: runner.os == 'macOS'
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          echo "$MAC_CSC_LINK" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/certificate.p12" -k "$KEYCHAIN" -P "$MAC_CSC_KEY_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/certificate.p12"
          security find-identity -v -p codesigning "$KEYCHAIN"

      # electron-builder wants APPLE_API_KEY as a path to the .p8 file, so the
      # secret is decoded outside the workspace, where it cannot be packaged.
      - name: Stage the notarisation key
        if: runner.os == 'macOS'
        env:
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          # notarytool rejects anything else, but only after the whole build.
          if ! [[ "$APPLE_API_ISSUER" =~ ^[0-9a-fA-F]{8}-([0-9a-fA-F]{4}-){3}[0-9a-fA-F]{12}$ ]]; then
            echo "::error::APPLE_API_ISSUER is not a UUID. Copy the Issuer ID from App Store Connect > Users and Access > Integrations > App Store Connect API."
            exit 1
          fi
          echo "$APPLE_API_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/AuthKey.p8"
          # notarytool only says "invalidPEMDocument", and only after the whole build.
          if ! grep -q -- '-----BEGIN PRIVATE KEY-----' "$RUNNER_TEMP/AuthKey.p8"; then
            echo "::error::APPLE_API_KEY_BASE64 does not decode to a .p8 private key. Set it with: base64 -w0 AuthKey_<id>.p8 | gh secret set APPLE_API_KEY_BASE64"
            exit 1
          fi

      # Signed and notarised on macOS; unsigned on Windows (see README, "Releasing").
      - name: Package
        run: npm run package -- --publish never
        env:
          APPLE_API_KEY: ${{ runner.os == 'macOS' && format('{0}/AuthKey.p8', runner.temp) || '' }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          # Without this, electron-builder hunts the Windows certificate store
          # and fails the job rather than shipping unsigned.
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ runner.os == 'macOS' }}

      - name: Upload to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$RUNNER_OS" = macOS ]; then files=(dist/*.dmg); else files=(dist/*-setup.exe); fi
          gh release upload "$TAG" "${files[@]}" --clobber

  # Only once both platforms have uploaded: a release is never public half-built.
  publish:
    needs: [draft, build]
    runs-on: ubuntu-latest
    steps:
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ needs.draft.outputs.version }}
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
